name: CI

on:
  push:
    branches: ["master"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Validate commit messages
        if: github.actor != 'dependabot[bot]'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun run commitlint:range -- --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            bun run commitlint:range -- --from "${{ github.event.before }}" --to "${{ github.sha }}"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            bun run commitlint:range -- --from HEAD^ --to HEAD
          fi
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | ./node_modules/.bin/commitlint
      - run: bun run check
      - run: bun run audit
      - name: Smoke test Node.js bundle
        run: |
          node dist/bin.node.js --help
          node dist/bin.node.js --version
      - name: Smoke test Bun bundle
        run: |
          bun dist/bin.bun.js --help
          bun dist/bin.bun.js --version
      - name: Smoke test launcher with Bun preferred
        run: dist/create-next-pro --help
      - name: Smoke test launcher with Node.js only
        run: env PATH="$(dirname "$(command -v node)"):/usr/bin:/bin" dist/create-next-pro --help
      - name: Inspect package contents
        run: |
          bun run package:pack /tmp/create-next-pro-pack.json
          bun run package:inspect /tmp/create-next-pro-pack.json
      - name: Install Zsh for completion validation
        run: sudo apt-get update && sudo apt-get install --yes zsh
      - name: Validate completion adapters
        run: |
          bash -n create-next-pro-completion.sh
          zsh -n create-next-pro-completion.zsh

  validate-template:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        manager: [bun, npm, pnpm]
    defaults:
      run:
        working-directory: templates/Projects/default
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: matrix.manager == 'bun'
        with:
          bun-version: 1.3.14
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: matrix.manager == 'pnpm'
        with:
          version: 11
      - name: Verify non-Bun consumer isolation
        if: matrix.manager != 'bun'
        run: test -z "$(command -v bun || true)"
      - name: Prepare package-manager-neutral consumer
        if: matrix.manager != 'bun'
        run: npm pkg delete packageManager
      - name: Install dependencies
        run: |
          if [ "${{ matrix.manager }}" = bun ]; then
            bun install --frozen-lockfile
          elif [ "${{ matrix.manager }}" = npm ]; then
            npm install
          else
            pnpm install --no-frozen-lockfile
          fi
      - run: ${{ matrix.manager }} run check
      - name: Validate isolated template consumer
        env:
          CNP_PACKAGE_MANAGER: ${{ matrix.manager }}
        run: ${{ matrix.manager }} run test:consumer
      - name: Install Chromium
        if: matrix.manager == 'npm'
        run: npx playwright install --with-deps chromium
      - name: Run visual integration tests
        if: matrix.manager == 'npm'
        run: npm run test:e2e
      - name: Run blocking security audit
        run: ${{ matrix.manager }} run audit

  governance-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Inspect governance drift without mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run github:plan -- --profile ci --json

  release-preflight:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.actor != 'create-next-pro-release[bot]'
    needs: [validate-cli, validate-template, governance-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: ENV
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify public npm release prerequisites
        shell: bash
        run: |
          npm ping
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)' "$(npm --version)"
          test "$GITHUB_REPOSITORY" = "Rising-Corporation/create-next-pro-cli"
          test "$(npm access get status create-next-pro-cli)" = "create-next-pro-cli: public"
          owners=$(npm owner ls create-next-pro-cli)
          grep -Eq '^mrrise[[:space:]]' <<< "$owners"
          repository=$(npm view create-next-pro-cli repository.url --json | jq -r .)
          test "$repository" = "git+https://github.com/Rising-Corporation/create-next-pro-cli.git"
          echo "Public npm metadata is valid; OIDC authentication will be minted only for npm publish"

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.actor != 'create-next-pro-release[bot]' && vars.RELEASE_ENABLED == 'true'
    needs:
      [validate-cli, validate-template, governance-check, release-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ENV
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-release-master
      cancel-in-progress: false
    steps:
      - name: Mint the dedicated release App token
        id: release-app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: Rising-Corporation
          repositories: create-next-pro-cli
      - name: Verify release App repository scope
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        shell: bash
        run: |
          repositories=$(gh api installation/repositories)
          test "$(jq -r .total_count <<< "$repositories")" = 1
          test "$(jq -r '.repositories[0].full_name' <<< "$repositories")" = "$GITHUB_REPOSITORY"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          fetch-depth: 0
          token: ${{ steps.release-app.outputs.token }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Configure release identity
        run: |
          git config user.name "create-next-pro release bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Resolve release state
        id: release
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        shell: bash
        run: |
          git fetch --force origin master '+refs/tags/*:refs/tags/*'
          current=$(jq -r .version package.json)
          if gh release view "v$current" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            export CNP_GITHUB_RELEASE_EXISTS=true
          else
            export CNP_GITHUB_RELEASE_EXISTS=false
          fi
          bun run release:check > /tmp/release.json
          cat /tmp/release.json
          echo "action=$(jq -r .action /tmp/release.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .targetVersion /tmp/release.json)" >> "$GITHUB_OUTPUT"
      - name: Prepare next patch
        if: steps.release.outputs.action == 'release'
        run: bun run release:prepare
      - name: Verify resumable release
        if: steps.release.outputs.action == 'resume'
        run: bun run release:resume
      - name: Build and inspect release archive
        if: steps.release.outputs.action == 'release' || steps.release.outputs.action == 'resume'
        id: package
        shell: bash
        run: |
          bun run check
          bun run package:pack /tmp/create-next-pro-pack.json
          archive=$(bun run --silent package:inspect /tmp/create-next-pro-pack.json | tail -n 1)
          test -f "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          sha256sum "$archive" | tee /tmp/create-next-pro-package.sha256
      - name: Install and smoke test release archive
        if: steps.release.outputs.action == 'release' || steps.release.outputs.action == 'resume'
        shell: bash
        run: |
          root=$(mktemp -d)
          trap 'rm -rf "$root"' EXIT
          npm install --prefix "$root/install" "$GITHUB_WORKSPACE/${{ steps.package.outputs.archive }}"
          cli="$root/install/node_modules/.bin/create-next-pro"
          "$cli" --help
          "$cli" --version
          mkdir -p "$root/config/create-next-pro" "$root/work"
          printf '%s\n' '{"version":1,"shell":"bash","completionInstalled":false,"createdAt":"2026-01-01T00:00:00.000Z","updatedAt":"2026-01-01T00:00:00.000Z"}' > "$root/config/create-next-pro/config.json"
          cd "$root/work"
          XDG_CONFIG_HOME="$root/config" "$cli" release-smoke
          test -f release-smoke/package.json
      - name: Persist release commit and tag
        if: steps.release.outputs.action == 'release'
        shell: bash
        run: |
          bun run release:commit -- "${{ steps.release.outputs.version }}"
          git push --atomic origin HEAD:master "refs/tags/v${{ steps.release.outputs.version }}:refs/tags/v${{ steps.release.outputs.version }}"
      - name: Publish exact archive
        if: steps.release.outputs.action == 'release' || steps.release.outputs.action == 'resume'
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          existing=$(npm view "create-next-pro-cli@$version" version --json 2>/dev/null | jq -r '. // empty') || true
          if [ "$existing" = "$version" ]; then
            bun scripts/verify-npm-provenance.ts create-next-pro-cli "$version" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$(git rev-parse HEAD)"
            echo "create-next-pro-cli@$version is already published by this trusted workflow"
          else
            npm publish "${{ steps.package.outputs.archive }}" --access public
          fi
      - name: Verify public release convergence
        if: steps.release.outputs.action == 'release' || steps.release.outputs.action == 'resume'
        shell: bash
        run: |
          expected="${{ steps.release.outputs.version }}"
          for attempt in 1 2 3 4 5 6; do
            published=$(npm view create-next-pro-cli version --json | jq -r .) || true
            [ "$published" = "$expected" ] && break
            sleep 10
          done
          test "$published" = "$expected"
          test "$(git show "v$expected:package.json" | jq -r .version)" = "$expected"
          test "$(git rev-list -n 1 "v$expected")" = "$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$(git rev-parse HEAD)"
          test "$(git ls-remote origin "refs/tags/v$expected^{}" | cut -f1)" = "$(git rev-parse HEAD)"
          git_head=$(npm view "create-next-pro-cli@$expected" gitHead 2>/dev/null || true)
          if [ -n "$git_head" ]; then
            test "$git_head" = "$(git rev-parse HEAD)"
          fi
          if [ "${{ steps.release.outputs.action }}" = release ]; then
            test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          fi
          bun scripts/verify-npm-provenance.ts create-next-pro-cli "$expected" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$(git rev-parse HEAD)"
          test "$(npm access get status create-next-pro-cli)" = "create-next-pro-cli: public"
          npm owner ls create-next-pro-cli | grep -Eq '^mrrise[[:space:]]'
          mkdir -p /tmp/npm-release-verification
          canonical=$(npm pack "create-next-pro-cli@$expected" --pack-destination /tmp/npm-release-verification --json | jq -r '.[0].filename')
          canonical="/tmp/npm-release-verification/$canonical"
          local_digest=$(cut -d ' ' -f1 /tmp/create-next-pro-package.sha256)
          test "$(sha256sum "$canonical" | cut -d ' ' -f1)" = "$local_digest"
      - name: Download canonical package for GitHub Release recovery
        if: steps.release.outputs.action == 'finalize'
        id: recovery-package
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          test "$(git show "v$version:package.json" | jq -r .version)" = "$version"
          test "$(git rev-list -n 1 "v$version")" = "$(git rev-parse HEAD)"
          git_head=$(npm view "create-next-pro-cli@$version" gitHead 2>/dev/null || true)
          if [ -n "$git_head" ]; then
            test "$git_head" = "$(git rev-parse HEAD)"
          fi
          bun scripts/verify-npm-provenance.ts create-next-pro-cli "$version" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$(git rev-parse HEAD)"
          mkdir -p /tmp/github-release
          archive=$(npm pack "create-next-pro-cli@$version" --pack-destination /tmp/github-release --json | jq -r '.[0].filename')
          archive="/tmp/github-release/$archive"
          test -f "$archive"
          sha256sum "$archive" | tee /tmp/create-next-pro-package.sha256
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Create or reconcile GitHub Release
        if: steps.release.outputs.action == 'release' || steps.release.outputs.action == 'resume' || steps.release.outputs.action == 'finalize'
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release v$version already exists"
          else
            if [ "${{ steps.release.outputs.action }}" = finalize ]; then
              archive="${{ steps.recovery-package.outputs.archive }}"
            else
              archive="${{ steps.package.outputs.archive }}"
            fi
            gh release create "v$version" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "v$version" \
              "$archive" \
              "/tmp/create-next-pro-package.sha256"
          fi
          release=$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,url)
          test "$(jq -r .tagName <<< "$release")" = "v$version"
          test "$(jq -r .isDraft <<< "$release")" = false
          test "$(jq -r .isPrerelease <<< "$release")" = false
          rm -rf /tmp/github-release-verification
          mkdir -p /tmp/github-release-verification
          archive_name="create-next-pro-cli-$version.tgz"
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" --pattern "$archive_name" --dir /tmp/github-release-verification
          expected_digest=$(cut -d ' ' -f1 /tmp/create-next-pro-package.sha256)
          test "$(sha256sum "/tmp/github-release-verification/$archive_name" | cut -d ' ' -f1)" = "$expected_digest"
          printf '%s\n' "$release"
      - name: Release summary
        if: always()
        run: |
          {
            echo "## npm release"
            echo "- action: ${{ steps.release.outputs.action || 'not-resolved' }}"
            echo "- version: ${{ steps.release.outputs.version || 'not-resolved' }}"
            echo "- source: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
